<svg width="100" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Background for the bar (e.g., light grey) -->
  <rect x="30" y="10" width="40" height="100" fill="#e0e0e0" rx="3" ry="3"/>

  <!-- Animated skill bar -->
  <rect x="30" width="40" fill="#F7DF1E" rx="3" ry="3">
    <animate attributeName="y" from="110" to="20" dur="1s" fill="freeze" />
    <animate attributeName="height" from="0" to="90" dur="1s" fill="freeze" />
  </rect>

  <!-- Percentage text (optional, can be tricky to position with animation) -->
  <!-- <text x="50" y="8" font-family="sans-serif" font-size="10" fill="#333" text-anchor="middle">90%</text> -->

  <!-- Skill name -->
  <text x="50" y="135" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">JavaScript (ES6+)</text>
</svg>
